{% extends "asistencia/base.html" %}

{% block title %}Contraseña Restablecida{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex justify-center items-center py-10">
    <div class="glass rounded-2xl p-8 md:p-10 fade-in w-full max-w-md text-center">
        <div class="mb-6">
            <h2 class="text-2xl font-semibold text-green-400">¡Contraseña restablecida!</h2>
            <p class="text-sm text-zinc-400 mt-4">
                Tu contraseña ha sido establecida correctamente. Ahora puedes continuar y acceder a tu cuenta.
            </p>
        </div>
        
        <div class="mt-6">
            <a href="{% url 'login' %}" class="w-full block btn-neo py-3 rounded-xl">Iniciar sesión</a>
        </div>
    </div>
</div>
{% endblock %}
