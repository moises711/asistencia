{% extends "asistencia/base.html" %}

{% block title %}Correo Enviado{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex justify-center items-center py-10">
    <div class="glass rounded-2xl p-8 md:p-10 fade-in w-full max-w-md text-center">
        <div class="mb-6">
            <h2 class="text-2xl font-semibold">Revisa tu correo</h2>
            <p class="text-sm text-zinc-400 mt-4">
                Hemos enviado instrucciones para restablecer tu contraseña a la dirección proporcionada, 
                siempre y cuando coincida con un usuario existente.
            </p>
        </div>
        
        <div class="mt-6">
            <a href="{% url 'login' %}" class="w-full block btn-neo py-3 rounded-xl">Volver al login</a>
        </div>
    </div>
</div>
{% endblock %}
