{% extends "asistencia/base_admin.html" %}

{% block title %}Cambiar contraseña{% endblock %}

{% block admin_content %}
<div class="glass rounded-2xl p-6 max-w-lg mx-auto">
    <h2 class="text-lg font-semibold text-zinc-200 mb-4">Cambiar contraseña</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-4">
            <button type="submit" class="btn-neo">Guardar nueva contraseña</button>
            <a href="/admin-dashboard/" class="btn-ghost ml-2">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
