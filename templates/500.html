<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error del servidor</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0b0b;color:#f5f5f5;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{max-width:560px;width:100%;background:#151515;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:32px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
    h1{margin:0 0 12px;font-size:clamp(2rem,4vw,3rem)}
    p{margin:0 0 24px;color:#a1a1aa;line-height:1.6}
    a{display:inline-block;background:linear-gradient(135deg,#ff3b3b,#ff6b3d);color:#fff;text-decoration:none;padding:12px 18px;border-radius:12px;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <h1>500</h1>
    <p>Ocurrió un error interno. Intenta de nuevo en unos minutos.</p>
    <a href="/dashboard/">Ir al panel</a>
  </main>
</body>
</html>
